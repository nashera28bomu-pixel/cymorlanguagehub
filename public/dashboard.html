<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Cymor Python Learner</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <a href="index.html" class="logo" style="text-decoration:none">🐍 Cymor <span>Python</span></a>
  <div id="userBox"></div>
</header>

<div class="container">
  <div id="continueCard" class="card hidden continue-card">
    <div style="font-size:0.8rem;color:var(--muted)" id="continueLabel">Continue where you left off</div>
    <h3 id="continueTitle"></h3>
    <button id="continueBtn" class="btn primary" style="margin-top:10px">Resume Lesson →</button>
  </div>

  <div class="card" id="progressCard">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>Your Progress</strong>
      <span id="progressText" style="color:var(--muted);font-size:0.85rem"></span>
    </div>
    <div class="progress-track" style="margin-top:8px">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <div id="lessonListWrap">
    <div id="lessonList"></div>
  </div>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
